# Runs the FULL stack (postgres, redis, backend, celery worker, frontend) in
# containers — an additive path alongside the host-based dev flow in start.sh /
# backend/docker-compose.yml, which only brings up postgres+redis for local
# `uvicorn --reload` / `npm run dev` development.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devmetrics
      POSTGRES_PASSWORD: devmetrics123
      POSTGRES_DB: devmetrics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmetrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://devmetrics:devmetrics123@postgres:5432/devmetrics
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://devmetrics:devmetrics123@postgres:5432/devmetrics
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Must resolve from the BROWSER, not from inside the frontend container —
        # NEXT_PUBLIC_* vars are baked into client-side JS at build time.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
